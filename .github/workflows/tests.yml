name: Run automated tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      DEMO_VALUE: ${{ secrets.DEMO_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check demo secret
        run: |
          if [ -n "$DEMO_VALUE" ]; then
            echo "DEMO_VALUE is available"
          else
            echo "DEMO_VALUE is missing"
            exit 1
          fi

      - name: Run API smoke tests
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pytest tests/api -m smoke -v

      - name: Run API regression tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest tests/api -m regression -v


  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI smoke tests
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pytest tests -m smoke -v --ignore=tests/api --ignore=tests/db --headless

      - name: Run UI regression tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest tests -m regression -v --ignore=tests/api --ignore=tests/db --headless

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failure
          path: |
            screenshots/
            logs/
  

  db-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_training
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: qa_training
      DB_USER: postgres
      DB_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          PGPASSWORD=test_password psql \
            -h localhost \
            -U postgres \
            -d qa_training \
            -f database/init.sql

      - name: Run DB smoke tests
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pytest tests/db -m smoke -v

      - name: Run DB regression tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest tests/db -m regression -v